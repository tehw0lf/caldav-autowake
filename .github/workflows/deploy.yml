name: zip and publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: external workflow
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      id-token: write
      actions: write
      attestations: write
      contents: write
      packages: write
      security-events: write
      pull-requests: write
    with:
      xpi_path: "caldav-autowake.xpi"
      addon_api_url_prefix: "https://addons.thunderbird.net/api/v4"
    secrets:
      ADDON_API_KEY: ${{ secrets.ATN_API_KEY }}
      ADDON_API_SECRET: ${{ secrets.ATN_API_SECRET }}
